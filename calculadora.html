<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculadora</title>
    <script src="js/calculadora.js" defer></script>
    <link rel="stylesheet" href="CSS/estilos.css">

</head>

<body>
    <header>
        <nav>
            <a href="index.html">Inicio</a>
            <a href="horario.html">Horario</a>
            <a href="formulario.html">Formulario</a>
            <a href="cuadernoejercicios.html">Cuaderno de ejercicios</a>
            <a href="ejemplo.html">Ejemplo</a>
            <a href="calculadora.html">Calculadora</a>
            <a href="PiedraPapelTijera.html">Juego</a>
            <a href="EstilosJavaScript.html">Modos</a>
        </nav>
    </header>
    <main class="calculadora">
        <h1>Calculadora</h1>
        <input id="pantalla" class="calculadora-pantalla" type="text" value="0" aria-label="Pantalla de la calculadora" readonly>
        <div class="calculadora-teclas">
            <button type="button" data-digit="7">7</button>
            <button type="button" data-digit="8">8</button>
            <button type="button" data-digit="9">9</button>
            <button type="button" data-operator="/">÷</button>
            <button type="button" data-digit="4">4</button>
            <button type="button" data-digit="5">5</button>
            <button type="button" data-digit="6">6</button>
            <button type="button" data-operator="*">×</button>
            <button type="button" data-digit="1">1</button>
            <button type="button" data-digit="2">2</button>
            <button type="button" data-digit="3">3</button>
            <button type="button" data-operator="-">−</button>
            <button type="button" data-digit="0" class="calculadora-cero">0</button>
            <button type="button" data-action="decimal">.</button>
            <button type="button" data-action="clear">Borrar</button>
            <button type="button" data-operator="+">+</button>
            <button type="button" data-action="equals" class="calculadora-igual">=</button>
        </div>
    </main>
    <footer>
        <p>CIFP Virgen de Gracia</p>
    </footer>
</body>
</html>
