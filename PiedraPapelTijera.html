<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Piedra, papel o tijera</title>
    <link rel="icon" href="imagenes/favicon.svg" type="image/svg+xml">
    <link id="tema-claro" rel="stylesheet" href="CSS/estilos.css">
    <link id="tema-oscuro" rel="stylesheet" href="CSS/oscuro.css" disabled>
    <script src="js/cambiamodo.js" defer></script>
    <script src="js/volver.js" defer></script>
    <script src="js/juego.js" defer></script>
</head>

<body>
    <header>
        <nav>
            <a href="index.html">Inicio</a>
            <a href="horario.html">Horario</a>
            <a href="formulario.html">Formulario</a>
            <a href="cuadernoejercicios.html">Cuaderno de ejercicios</a>
            <a href="ejemplo.html">Ejemplo</a>
            <a href="calculadora.html">Calculadora</a>
            <a href="PiedraPapelTijera.html" class="activo" aria-current="page">Juego</a>
        </nav>
        <button type="button" class="theme-toggle" data-cambiar-tema aria-pressed="false">Modo oscuro</button>
    </header>
    <main class="juego">
        <p class="juego-etiqueta">Un clásico de siempre</p>
        <h1>Piedra, papel o tijera</h1>
        <p class="juego-introduccion">Elige una opción y juega contra el ordenador.</p>
        <div class="juego-opciones" role="group" aria-label="Elige tu jugada">
            <button type="button" data-eleccion="piedra">
                <span class="juego-icono" aria-hidden="true">✊</span>
                <span>Piedra</span>
            </button>
            <button type="button" data-eleccion="papel">
                <span class="juego-icono" aria-hidden="true">✋</span>
                <span>Papel</span>
            </button>
            <button type="button" data-eleccion="tijera">
                <span class="juego-icono" aria-hidden="true">✌</span>
                <span>Tijera</span>
            </button>
        </div>
        <p id="resultado-juego" class="juego-resultado" aria-live="polite" aria-atomic="true">Haz tu jugada para empezar.</p>
        <div class="juego-marcador" aria-label="Marcador">
            <div class="juego-jugador">
                <span class="juego-nombre">Tú</span>
                <span id="puntos-jugador" class="juego-puntos">0</span>
            </div>
            <span class="juego-separador" aria-hidden="true">:</span>
            <div class="juego-jugador">
                <span class="juego-nombre">Ordenador</span>
                <span id="puntos-ordenador" class="juego-puntos">0</span>
            </div>
        </div>
        <button type="button" id="reiniciar-juego" class="juego-reiniciar">Reiniciar partida</button>
    </main>
    <footer>
        <p>CIFP Virgen de Gracia</p>
    </footer>
</body>

</html>
